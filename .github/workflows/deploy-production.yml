name: deploy-production

# PRODUCTION: this deploys hyperagent.lol, which is served by Fly.io
# (app `hyperagent-app`, fronted by CloudFront E1CN18K0LLPOH3).
# Pushes to the production branch deploy directly — there is no dev hop.
# Fly machine swaps take ~1 minute; one deploy at a time (runs queue via
# the concurrency group below, they are not cancelled mid-rollout).
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        working-directory: web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy . -c fly.app.toml --remote-only
