name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f web/Dockerfile.app \
            -t "$ECR_REGISTRY/hyperagent-app:latest" \
            -t "$ECR_REGISTRY/hyperagent-app:${{ github.sha }}" \
            web

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/hyperagent-app:latest"
          docker push "$ECR_REGISTRY/hyperagent-app:${{ github.sha }}"

      # App Runner auto-deploys on :latest pushes; this explicit StartDeployment
      # is belt-and-braces. It must not fail the job if the service does not
      # exist yet (first deploy happens before the service is created).
      - name: Trigger App Runner deployment
        run: |
          SERVICE_ARN=$(aws apprunner list-services --region us-east-1 \
            --query "ServiceSummaryList[?ServiceName=='hyperagent-app'].ServiceArn | [0]" \
            --output text)
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            aws apprunner start-deployment --region us-east-1 --service-arn "$SERVICE_ARN" || true
          else
            echo "App Runner service hyperagent-app not found; skipping StartDeployment."
          fi
