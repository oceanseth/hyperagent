name: pr-check

# Prove web install, typecheck, production build, and both images on pull
# requests to dev. No registry push and no deploy credentials.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install, typecheck, and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t hyperagent-app -f web/Dockerfile.app web

      - name: App image constructs PrismaClient
        run: docker run --rm --entrypoint node hyperagent-app -e "const fs=require('fs');const path=require('path');function walk(dir,found=[]){for(const name of fs.readdirSync(dir)){const full=path.join(dir,name);if(name==='@prisma'&&fs.existsSync(path.join(full,'client','package.json'))){found.push(path.join(full,'client'));continue;}let dirent=false;try{dirent=fs.statSync(full).isDirectory()}catch{}if(name==='node_modules'||dirent){try{walk(full,found)}catch{}}}return found;}const hits=walk('/app');if(!hits.length)throw new Error('Prisma client is not in the image');const {PrismaClient}=require(hits[0]);new PrismaClient();console.log('prisma-client-ok')"

      - name: Build worker image
        run: docker build -t hyperagent-worker -f web/Dockerfile.worker web

      - name: Worker image constructs PrismaClient
        run: docker run --rm --entrypoint node hyperagent-worker -e "const {PrismaClient}=require('@prisma/client');new PrismaClient();console.log('prisma-client-ok')"
