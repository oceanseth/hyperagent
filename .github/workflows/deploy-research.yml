name: Deploy research worker to Fly
# The research worker is a single shared Fly instance used by BOTH
# dev.hyperagent.lol and hyperagent.lol, so it ships with production releases
# only (or by manual workflow_dispatch).
on:
  push:
    branches: [production]
    paths: ['web/worker/**', 'web/src/server/**', 'web/src/lib/**', 'web/src/mastra/**', 'web/package*.json', 'web/Dockerfile.worker', 'web/fly.toml', '.github/workflows/deploy-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-research
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false --config fly.toml
        if: env.FLY_API_TOKEN != ''
        working-directory: web
      - run: echo "::warning title=Fly worker not deployed::FLY_API_TOKEN is not set in repository secrets, so the research and browser-agent worker was not deployed."
        if: env.FLY_API_TOKEN == ''
