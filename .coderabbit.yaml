# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - '!**/package-lock.json'
    - '!web/src/routeTree.gen.ts'
    - '!.beads/**'
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - '^main$'
      - '^dev$'
chat:
  auto_reply: true
